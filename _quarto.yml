project:
  type: website
  output-dir: _site
  pre-render: python3 scripts/prepare-site.py
  resources:
    - CNAME
    - assets/fonts/
    - assets/js/
    - assets/vendor/
    - assets/uploads/
    - assets/og.png
    - cv/vlachos-cv.pdf

# The preparation hook generates this from the browser-editable profile.
metadata-files:
  - _generated/site.yml

lang: en-AU

website:
  site-url: "https://ioannisvlachos.com"
  repo-url: "https://github.com/vlachosi/vlachosi.github.io"
  favicon: assets/favicon.svg
  image: /assets/og.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search:
    location: navbar
    type: overlay
  page-navigation: false
  back-to-top-navigation: false
  page-footer:
    right:
      - icon: rss
        href: writing/index.xml
        aria-label: RSS feed

format:
  html:
    theme:
      light: [styles/common.scss, styles/light.scss]
      dark: [styles/common.scss, styles/dark.scss]
    respect-user-color-scheme: false
    css: styles/fonts.css
    html-math-method:
      method: katex
      url: /assets/vendor/katex/
    highlight-style:
      light: a11y
      dark: a11y-dark
    code-copy: hover
    title-block-categories: false
    anchor-sections: true
    smooth-scroll: false
    link-external-icon: false
    link-external-newwindow: false

execute:
  freeze: auto
