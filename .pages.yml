# Browser editor: https://app.pagescms.org
# Saves commit to the branch selected in Pages CMS. On main, successful builds deploy.
# See docs/CMS-CONFIG.md for preview, publishing, and compatibility notes.
settings:
  content:
    # Preserve post options outside these forms, including include-after-body.
    # Pages CMS does not apply merge to top-level arrays; keep their schemas complete.
    merge: true

actions:
  - name: build-preview
    label: Build preview
    workflow: preview.yml
    ref: current
    confirm:
      title: Build a site preview?
      message: Build the saved content on this branch, including drafts. Download the site-preview artifact from the completed GitHub Actions run. This action does not publish the website.
      button: Build preview

media:
  - name: post_assets
    label: Images and attachments
    input: assets/uploads
    output: /assets/uploads
    extensions: [png, jpg, jpeg, webp, avif, gif, svg, pdf]
    rename: safe
  - name: cv_uploads
    label: CV PDFs
    input: _cv-uploads
    # This is a repository source path, consumed by the site's preparation script.
    # Only the selected PDF is copied to the stable public cv/vlachos-cv.pdf path.
    output: _cv-uploads
    extensions: [pdf]
    rename: safe

components:
  entry_links:
    type: object
    label: Additional links
    list: true
    fields:
      - name: label
        type: string
        required: true
      - name: url
        label: URL
        type: string
        required: true
  placeholder:
    type: boolean
    label: Mark as placeholder
    default: false
    description: Sample content shown in preview and excluded from the live site.
  entry_draft:
    type: boolean
    label: Keep as draft
    default: false
    description: Show in preview only. Source files remain visible in this public repository.
  featured:
    type: boolean
    label: Feature on homepage
    default: false
  display_order:
    type: number
    label: Display order
    default: 100
    description: Lower numbers appear first; leave at 100 for normal priority.

content:
  - name: posts
    label: Writing
    type: collection
    path: writing/posts
    format: yaml-frontmatter
    subfolders: true
    filename:
      template: "{fields.date}-{title}/index.qmd"
      # Generated templates retain subfolders; the editable filename field does not.
      field: false
    operations:
      rename: false
    view:
      layout: list
      fields: [title, date, draft]
      primary: title
      sort: [date, title]
      search: [title, description]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Summary
        type: text
        required: true
      - name: date
        label: Post date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: Used in the folder name when creating a post. Changing it later keeps the URL.
      - name: categories
        label: Topics
        type: string
        list: true
      - name: draft
        label: Keep as draft
        type: boolean
        default: true
        description: Drafts are excluded from the live site. Source files remain visible in this public repository.
      - name: image
        label: Listing image
        type: image
        options:
          media: post_assets
          categories: [image]
      - name: image-alt
        label: Image description
        type: string
      - name: body
        label: Article
        type: code
        required: true
        options:
          format: markdown
        description: Markdown and Quarto source. This editor preserves equations, code cells, and custom HTML. Use Quarto preview to see the rendered article.

  - name: research
    label: Research
    type: file
    path: research/papers.yml
    format: yaml
    list: true
    operations:
      delete: false
    fields:
      - name: title
        type: string
        required: true
      - name: status
        type: select
        required: true
        options:
          values:
            - name: published
              label: Published
            - name: working
              label: Working paper
            - name: progress
              label: In progress
            - name: thesis
              label: Thesis
      - name: year
        type: number
      - name: authors
        type: string
      - name: venue
        type: string
      - name: abstract
        type: text
      - name: href
        label: Main link
        type: string
      - name: links
        component: entry_links
      - name: placeholder
        component: placeholder
      - name: draft
        component: entry_draft
      - name: featured
        component: featured
      - name: order
        component: display_order

  - name: projects
    label: Projects
    type: file
    path: projects/projects.yml
    format: yaml
    list: true
    operations:
      delete: false
    fields:
      - name: title
        type: string
        required: true
      - name: kind
        label: Type
        type: string
      - name: description
        type: text
      - name: href
        label: Main link
        type: string
      - name: tags
        type: string
        list: true
      - name: links
        component: entry_links
      - name: placeholder
        component: placeholder
      - name: draft
        component: entry_draft
      - name: featured
        component: featured
      - name: order
        component: display_order

  - name: profile
    label: Profile and contact
    type: file
    path: _data/profile.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
      - name: affiliation
        label: Affiliation
        type: string
      - name: bio
        label: Biography
        type: code
        options:
          format: markdown
        description: Markdown text shared by the homepage and About page.
      - name: rig
        label: Computing setup
        type: string
      - name: email
        label: Contact email
        type: string
        description: Leave blank to hide the contact link. Saved contact details are public.
      - name: links
        label: Profile links
        type: object
        fields:
          - name: orcid
            label: ORCID URL
            type: string
          - name: ssrn
            label: SSRN URL
            type: string
          - name: github
            label: GitHub URL
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: bluesky
            label: Bluesky URL
            type: string
          - name: x
            label: X URL
            type: string
      - name: sections
        label: Additional pages
        type: object
        fields:
          - name: talks
            label: Publish Talks page
            type: boolean
            default: false
          - name: teaching
            label: Publish Teaching page
            type: boolean
            default: false

  - name: cv
    label: CV
    type: file
    path: _data/cv.yml
    format: yaml
    operations:
      delete: false
    fields:
      - name: source
        label: Current CV PDF
        type: file
        options:
          media: cv_uploads
          extensions: [pdf]
        description: Upload and select the latest PDF, then save. The website keeps its existing CV download address. Clear this field to show the placeholder.
      - name: updated
        label: CV last updated
        type: date
        default: ""
        options:
          format: yyyy-MM-dd
        description: Optional date displayed on the CV page; update it when you upload a new version.

  - name: talks
    label: Talks
    type: file
    path: talks/talks.yml
    format: yaml
    list: true
    operations:
      delete: false
    fields:
      - name: title
        type: string
        required: true
      - name: when
        label: Date or period
        type: string
      - name: where
        label: Venue
        type: string
      - name: description
        type: text
      - name: href
        label: Main link
        type: string
      - name: links
        component: entry_links
      - name: placeholder
        component: placeholder

  - name: teaching
    label: Teaching
    type: file
    path: teaching/teaching.yml
    format: yaml
    list: true
    operations:
      delete: false
    fields:
      - name: title
        type: string
        required: true
      - name: when
        label: Date or period
        type: string
      - name: where
        label: Role and institution
        type: string
      - name: description
        type: text
      - name: href
        label: Main link
        type: string
      - name: links
        component: entry_links
      - name: placeholder
        component: placeholder
