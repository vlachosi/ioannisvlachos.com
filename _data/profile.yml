bio: |
  I'm an Honours Student at Monash Business School. My research focuses on information and market efficiency, particularly in options and volatility. I study how much information is already reflected in prices and how quickly and fully markets respond to new information, from scheduled announcements such as earnings releases to unexpected events.

about_extra: |
  I also like building computers and experimenting with AI. I'm currently putting together a homelab setup to run models locally.

